[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-docs"
version = "0.2.0"
description = "Evidence-first document intelligence with inspectable citations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michael Dai"}]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
pdf = ["pypdf>=5,<7"]

[project.scripts]
atlas = "atlas.__main__:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["static/*.html", "static/*.js"]
